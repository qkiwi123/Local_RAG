[pytest]
testpaths = tests eval
markers =
    external: calls a real external API and is skipped unless --run-external is provided
    integration: uses the local embedding model and isolated vector database
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:'asyncio\.iscoroutinefunction' is deprecated.*:DeprecationWarning:pytest_asyncio\.plugin
    ignore:'asyncio\.get_event_loop_policy' is deprecated.*:DeprecationWarning:pytest_asyncio\.plugin
