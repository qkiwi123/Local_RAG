name: tests

on:
  push:
  pull_request:

env:
  HF_HUB_OFFLINE: "1"
  PYTHONUTF8: "1"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci*.txt
      - name: Install CPU-only PyTorch for device validation tests
        run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-ci.txt
      # Public clones do not include document fixtures or frozen evaluation data.
      # These suites remain available for developers who prepare local data.
      # The Windows launcher and offline update suites run in windows-portable.
      - name: Run unit tests that do not require private test data
        run: >-
          python -m pytest tests -m "not integration and not external" -q
          --ignore=tests/test_api.py
          --ignore=tests/test_parser.py
          --ignore=tests/test_structured_ingest.py
          --ignore=tests/test_hybrid_dataset.py
          --ignore=tests/test_sparse_rebuild.py
          --ignore=tests/test_portable_w3.py
          --ignore=tests/test_local_update.py
          --deselect=tests/test_pdf_adapter.py::test_pdfium_engine_reads_real_pdf_fixture
          --deselect=tests/test_rebuild_sparse_index.py::test_controlled_build_on_isolated_real_storage
          --deselect=tests/test_sparse_lifecycle.py::TestUploadLifecycleIntegration

  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci-portable.txt
      - name: Install portable test dependencies
        run: python -m pip install -r requirements-ci-portable.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build frontend for offline update tests
        working-directory: web
        run: npm run build
      - name: Run Windows launcher and offline update tests
        run: python -m pytest -q tests/test_portable_w3.py tests/test_local_update.py
