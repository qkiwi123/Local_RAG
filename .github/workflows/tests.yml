name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install CPU-only PyTorch for device validation tests
        run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pytest -m "not integration and not external" -q
